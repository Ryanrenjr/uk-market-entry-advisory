name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The production build fails without a real canonical URL (see
      # src/lib/metadata.ts) — CI isn't deploying anywhere, so a placeholder
      # https URL is enough to let the build complete and be checked.
      NEXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
